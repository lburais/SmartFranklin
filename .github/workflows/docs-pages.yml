# SPDX-License-Identifier: MIT

name: Publish Doxygen Docs

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Doxygen dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz make

      - name: Generate docs
        run: make docs

      - name: Verify generated docs
        run: test -f docs/html/index.html

      - name: Add nojekyll marker
        run: touch docs/html/.nojekyll

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
