[platformio]
default_envs = m5stack-station-bat

[env:m5stack-station-bat]
platform = espressif32@6.8.1
board = m5stack-station-bat
custom_hardware = M5Station BAT
build_flags     =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

[env]
framework = arduino

; Serial monitor speed
monitor_speed = 115200
; Keep serial stream raw so ANSI escape sequences (colors) pass through.
monitor_raw = yes

build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D ARDUINOJSON_ENABLE_STD_STRING
  -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
;  -D DISABLE_HMI
  -D DISABLE_HW_MONITOR
  -D DISABLE_WATCHDOG
  -D DISABLE_BATTERY
;  -D DISABLE_GAZ
  -D DISABLE_TANK 
;  -D DISABLE_LEVEL
  -D DISABLE_RTC
;  -D DISABLE_GPS

board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

; Custom metadata fields
custom_description     = SmartFranklin

; extra_scripts = scripts/generate_docs.py

lib_deps =

  ; ------------------------------------------------------------------------------------
  ; M5Stack
  ; ------------------------------------------------------------------------------------

  ; https://github.com/m5stack/M5GFX
  ; https://github.com/m5stack/M5Unit
  ; https://github.com/m5stack/M5UnitUnified
  M5GFX=m5stack/M5GFX
  M5Unified=m5stack/M5Unified
  M5UnitUnified=m5stack/M5UnitUnified

  ; https://github.com/m5stack/M5Unit-WEIGHT
  ; SKU:U180 = Weight I2C Unit
  ; https://docs.m5stack.com/en/unit/Unit-Weight%20I2C
  M5UnitUnifiedWEIGHT=m5stack/M5Unit-WEIGHT
  ;https://github.com/m5stack/M5Unit-Miniscale ;m5stack/M5Unit-Miniscale
  
  ; ------------------------------------------------------------------------------------
  ; Adafruit
  ; ------------------------------------------------------------------------------------

  Adafruit-NeoPixel=adafruit/Adafruit NeoPixel

  ; ------------------------------------------------------------------------------------
  ; h2zero
  ; ------------------------------------------------------------------------------------

  ; https://github.com/h2zero/NimBLE-Arduino
  NimBLE-Arduino=h2zero/NimBLE-Arduino

  ; ------------------------------------------------------------------------------------
  ; bblanchon
  ; ------------------------------------------------------------------------------------

  ArduinoJson=bblanchon/ArduinoJson

  ; ------------------------------------------------------------------------------------
  ; esp32async
  ; ------------------------------------------------------------------------------------

  ESPAsyncWebServer=esp32async/ESPAsyncWebServer
  AsyncTCP=esp32async/AsyncTCP
  ;ESPAsyncDNSServer=esphome/ESPAsyncDNSServer

  ; ------------------------------------------------------------------------------------
  ; ayushsharma82
  ; ------------------------------------------------------------------------------------

  AsyncElegantOTA=ayushsharma82/ElegantOTA ;ayushsharma82/AsyncElegantOTA

  ; ------------------------------------------------------------------------------------
  ; MQTT
  ; ------------------------------------------------------------------------------------

  PubSubClient=knolleary/PubSubClient
  sMQTTBroker=terrorsl/sMQTTBroker

; Ignore legacy BLE libs to avoid conflicts with NimBLE
lib_ignore =
  ESP32 BLE Arduino
  NimBLE

